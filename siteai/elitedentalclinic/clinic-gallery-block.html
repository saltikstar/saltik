<style id="edc-gallery-v21-css">
#edc-clinic-gallery,#edc-clinic-gallery *{box-sizing:border-box}
#edc-clinic-gallery{font-family:"TildaSans",Arial,Helvetica,sans-serif;background:#fff;color:#20282c;padding:clamp(36px,5vw,72px) 0;scroll-margin-top:100px}
#edc-clinic-gallery .edcg-wrap{width:calc(100% - 160px);max-width:1440px;margin:auto}
#edc-clinic-gallery .edcg-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}
#edc-clinic-gallery .edcg-kicker{display:block;color:#89682f;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:8px}

#edc-clinic-gallery .edcg-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));height:clamp(260px,30vw,420px);gap:8px}

#edc-clinic-gallery .edcg-dialog{padding:12px;border:0;max-width:min(94vw,1100px);max-height:94vh;width:100%;background:#20282c;color:white}
#edc-clinic-gallery .edcg-dialog::backdrop{background:rgba(15,20,22,.85)}
#edc-clinic-gallery .edcg-full{display:block;width:100%;height:min(72vh,700px);object-fit:contain}
#edc-clinic-gallery .edcg-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 0}
#edc-clinic-gallery .edcg-controls button{background:#384247;border:1px solid #92713c;color:white;min-height:44px;padding:8px 14px;font:inherit;cursor:pointer}
@media(hover:hover){#edc-clinic-gallery .edcg-image:hover img{transform:scale(1.035)}}
@media(max-width:1100px){#edc-clinic-gallery .edcg-wrap{width:calc(100% - 56px)}}
@media(max-width:640px){#edc-clinic-gallery .edcg-wrap{width:calc(100% - 36px)}#edc-clinic-gallery .edcg-grid{grid-template-columns:1fr 1fr;grid-template-rows:190px 100px 100px;height:auto}#edc-clinic-gallery .edcg-image:first-child{grid-column:span 2;grid-row:auto}#edc-clinic-gallery .edcg-head{align-items:start;gap:8px;flex-direction:column}#edc-clinic-gallery .edcg-full{height:60vh}}
@media(prefers-reduced-motion:reduce){#edc-clinic-gallery .edcg-image img{transition:none}}
</style>
