<style id="edc-reviews-v32-css">
#edc-reviews,#edc-reviews *{box-sizing:border-box}
#edc-reviews{padding:clamp(36px,5vw,72px) 0;background:#fff;color:#20282c;font-family:"TildaSans",Arial,Helvetica,sans-serif;scroll-margin-top:100px}
#edc-reviews .edr-wrap{width:calc(100% - 160px);margin:auto}
#edc-reviews .edr-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
#edc-reviews h2{font-family:"TildaSans",Arial,Helvetica,sans-serif!important;font-weight:600!important;font-size:clamp(36px,4.5vw,70px)!important;line-height:1.08!important;letter-spacing:-.045em;margin:0!important;color:#20282c!important}
#edc-reviews h2 span{color:#89682f;font-weight:inherit}
#edc-reviews .edr-arrows{display:flex;gap:8px;flex-shrink:0}
#edc-reviews .edr-arrow{width:46px;height:46px;display:grid;place-items:center;border:1px solid #c7b89d;border-radius:8px;background:#fff;color:#80612e;font:400 23px/1 Arial,sans-serif;cursor:pointer}
#edc-reviews .edr-arrow:disabled{opacity:.35;cursor:default}
#edc-reviews .edr-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 90px)/4);align-items:start;gap:30px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#edc-reviews .edr-track::-webkit-scrollbar{display:none}
#edc-reviews .edr-slide{display:block;width:100%;min-width:0;border:0;padding:0;background:transparent;cursor:zoom-in;scroll-snap-align:start}
#edc-reviews .edr-slide img{width:100%;height:auto;display:block;object-fit:contain;max-height:460px}
#edc-reviews .edr-dialog{border:0;padding:0;background:transparent;color:white;max-width:96vw;max-height:96dvh;width:max-content;overflow:visible;margin:auto}
#edc-reviews .edr-dialog::backdrop{background:rgba(12,17,19,.88)}
#edc-reviews .edr-inner{position:relative;display:grid;justify-items:center;gap:10px}
#edc-reviews .edr-large{display:block;max-width:92vw;max-height:calc(92dvh - 70px);width:auto;height:auto;object-fit:contain}
#edc-reviews .edr-close,#edc-reviews .edr-nav button{display:grid;place-items:center;min-width:44px;height:44px;border:1px solid #ffffff80;border-radius:8px;background:#20282c;color:white;font:400 24px/1 Arial,sans-serif;padding:0;cursor:pointer}
#edc-reviews .edr-close{position:absolute;top:8px;right:8px;z-index:2}
#edc-reviews .edr-nav{display:flex;align-items:center;gap:18px}
#edc-reviews .edr-count{font-size:14px;color:white}
#edc-reviews :is(button,.edr-track):focus-visible{outline:2px solid #89682f;outline-offset:2px}
@media(max-width:1100px){#edc-reviews .edr-wrap{width:calc(100% - 56px)}#edc-reviews .edr-track{grid-auto-columns:calc((100% - 60px)/3)}}
@media(max-width:850px){#edc-reviews .edr-track{grid-auto-columns:calc((100% - 30px)/2)}}
@media(max-width:720px){#edc-reviews .edr-wrap{width:calc(100% - 36px)}#edc-reviews .edr-arrow{width:40px;height:40px}}
@media(max-width:540px){#edc-reviews .edr-track{grid-auto-columns:100%}#edc-reviews .edr-slide img{max-height:420px}}
</style>
