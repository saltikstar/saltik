<style id="edc-promos-v23-css">
#edc-promos,#edc-promos *{box-sizing:border-box}
#edc-promos{padding:clamp(30px,4vw,64px) 0;background:#fff;color:#20282c;font-family:"TildaSans",Arial,Helvetica,sans-serif;scroll-margin-top:100px}
#edc-promos .edcp-wrap{width:calc(100% - 160px);margin:auto}
#edc-promos .edcp-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:clamp(16px,2vw,26px)}
#edc-promos h2{font-family:"TildaSans",Arial,Helvetica,sans-serif!important;font-size:clamp(36px,4.5vw,70px)!important;font-weight:600!important;line-height:1.08!important;letter-spacing:-.045em;margin:0!important;color:#20282c!important}

#edc-promos .edcp-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;scroll-behavior:smooth}

@media(max-width:1100px){#edc-promos .edcp-wrap{width:calc(100% - 56px)}#edc-promos .edcp-track{grid-auto-columns:calc((100% - 16px)/2)}}

#edc-promos .edcp-modal-inner{position:relative;display:grid;justify-items:center;gap:10px}
#edc-promos .edcp-large{display:block;width:auto;height:auto;max-width:92vw;max-height:calc(94dvh - 70px);object-fit:contain;border-radius:8px}
#edc-promos .edcp-close,#edc-promos .edcp-modal-nav button{display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(255,255,255,.5);border-radius:8px;background:#20282c;color:#fff;font:400 25px/1 Arial,sans-serif;padding:0}
#edc-promos .edcp-close{position:absolute;top:8px;right:8px;z-index:2}
#edc-promos .edcp-modal-nav{display:flex;align-items:center;justify-content:center;gap:18px}
#edc-promos .edcp-modal-count{font-size:14px;color:white}
@media(max-width:720px){#edc-promos .edcp-wrap{width:calc(100% - 36px)}}
</style>
