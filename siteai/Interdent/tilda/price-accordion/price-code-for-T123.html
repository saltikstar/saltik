<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap');
.ic-prices{box-sizing:border-box;background:#faf9f7;color:#51483f;padding:80px 0;font:400 18px/1.55 Manrope,Arial,sans-serif}
.ic-prices *, .ic-prices *::before, .ic-prices *::after{box-sizing:border-box}
.ic-prices a{color:inherit;text-decoration:none}
.ic-prices .container{width:min(1328px,calc(100% - 60px));margin:0 auto}
.ic-prices .section-top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:0 0 46px}
.ic-prices .overline{font:600 13px/1.4 Manrope,Arial,sans-serif;letter-spacing:.12em;color:#9d8e7d;margin:0 0 12px}
.ic-prices h2{font:500 clamp(48px,5vw,76px)/.98 'Cormorant Garamond',Georgia,serif;margin:0}
.ic-prices .section-lead{max-width:400px;color:#736a61;font-size:17px;margin:0}
.ic-prices .price-layout{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr);gap:54px;align-items:start}
.ic-prices .price-sidebar{position:sticky;top:28px;align-self:start;border-radius:24px;background:#eee8df;padding:30px 25px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.ic-prices .price-sidebar p{font-size:13px;letter-spacing:.1em;color:#897868;margin:0}
.ic-prices .price-sidebar strong{font-size:19px;line-height:1.3}
.ic-prices .price-sidebar>span{font:500 43px/1.1 'Cormorant Garamond',Georgia,serif}
.ic-prices .button{display:inline-flex;align-items:center;gap:15px;padding:14px 19px;border-radius:100px;background:#c9bdac;color:#413832;font:600 14px/1.3 Manrope,Arial,sans-serif;min-height:46px;max-width:100%}
.ic-prices .button svg{width:19px;height:19px;stroke:currentColor;flex:none}
.ic-prices .price-list{min-width:0;border-top:1px solid #d6cec4}
.ic-prices .price-group{border-bottom:1px solid #d6cec4}
.ic-prices .price-header{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;padding:17px 0;font:500 clamp(25px,2.75vw,35px)/1.08 'Cormorant Garamond',Georgia,serif}
.ic-prices .price-header>span:first-child{display:flex;align-items:baseline;gap:18px}
.ic-prices .price-header small{font:700 13px/1 Manrope,Arial,sans-serif;color:#a69889;flex:none}
.ic-prices .price-header:focus-visible{outline:2px solid #9b805e;outline-offset:3px;border-radius:8px}
.ic-prices .price-toggle{width:36px;height:36px;border:1px solid #c6bbac;border-radius:100%;display:grid;place-items:center;flex:none;font:400 24px/1 Manrope,Arial,sans-serif;transition:transform .2s ease,background-color .2s}
.ic-prices .price-group.ic-is-open .price-toggle{transform:rotate(45deg);background:#e9e0d4}
.ic-prices .price-rows{padding:0 0 18px 33px;min-width:0}
.ic-prices .price-rows[hidden]{display:none!important}
.ic-prices .price-row{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:13px 0;border-bottom:1px solid #e6e0d8;font:400 16px/1.4 Manrope,Arial,sans-serif}
.ic-prices .price-row span{min-width:0}
.ic-prices .price-row strong{font-weight:700;text-align:right;white-space:nowrap;flex-shrink:0}
.ic-prices .price-note{font-size:14px;color:#796d63;line-height:1.5}
.ic-prices .price-download{padding:28px 0 0}
@media(max-width:960px){.ic-prices .price-layout{grid-template-columns:1fr;gap:28px}.ic-prices .price-sidebar{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}.ic-prices .section-top{align-items:start}}
@media(max-width:640px){.ic-prices{padding:42px 0}.ic-prices .container{width:calc(100% - 32px)}.ic-prices .section-top{flex-direction:column;gap:10px;margin-bottom:26px}.ic-prices h2{font-size:clamp(42px,12vw,60px)}.ic-prices .section-lead{font-size:15px}.ic-prices .price-sidebar{padding:22px 18px;gap:10px}.ic-prices .price-sidebar strong{font-size:16px}.ic-prices .price-header{min-height:66px;font-size:clamp(25px,7.3vw,31px);gap:12px}.ic-prices .price-header>span:first-child{gap:10px}.ic-prices .price-header small{font-size:11px}.ic-prices .price-toggle{width:34px;height:34px}.ic-prices .price-rows{padding-left:0}.ic-prices .price-row{font-size:14px;gap:12px}.ic-prices .price-row strong{white-space:normal;min-width:90px;font-size:14px}.ic-prices .button{font-size:13px}}
@media(prefers-reduced-motion:reduce){.ic-prices .price-toggle{transition:none}}

</style>
<script>
(function () {
  'use strict';
  const ROOT = '.ic-price-accordion';

  function setOpen(group, open) {
    const header = group.querySelector('.ic-price-header');
    const content = group.querySelector('.ic-price-content');
    if (!header || !content) return;
    group.classList.toggle('ic-is-open', open);
    header.setAttribute('aria-expanded', String(open));
    content.hidden = !open;
    content.style.display = open ? '' : 'none';
  }

  function init() {
    document.querySelectorAll(ROOT).forEach(function (root) {
      if (root.dataset.icReady === '1') return;
      const items = Array.from(root.querySelectorAll('.ic-price-item'));
      if (!items.length) return;

      items.forEach(function (group, index) {
        const header = group.querySelector('.ic-price-header');
        const content = group.querySelector('.ic-price-content');
        if (!header || !content) return;
        header.setAttribute('role', 'button');
        header.setAttribute('tabindex', '0');
        if (!content.id) content.id = 'ic-price-panel-' + (index + 1);
        header.setAttribute('aria-controls', content.id);
        setOpen(group, index === 0);
      });
      root.dataset.icReady = '1';
    });
  }

  function toggleFrom(target) {
    const header = target.closest('.ic-price-header');
    if (!header) return;
    const group = header.closest('.ic-price-item');
    const root = header.closest(ROOT);
    if (!group || !root) return;
    const open = !group.classList.contains('ic-is-open');
    root.querySelectorAll('.ic-price-item').forEach(function (item) {
      setOpen(item, item === group && open);
    });
  }

  document.addEventListener('click', function (event) {
    if (event.target.closest('a')) return;
    toggleFrom(event.target);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    if (!event.target.closest('.ic-price-header')) return;
    event.preventDefault();
    toggleFrom(event.target);
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
  window.addEventListener('load', init, { once: true });
  const observer = new MutationObserver(function () {
    if (document.querySelector(ROOT + ':not([data-ic-ready])')) init();
  });
  observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
